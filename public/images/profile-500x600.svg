<svg width="500" height="600" viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="600" fill="url(#bgGradient2)"/>

  <!-- Main avatar circle -->
  <circle cx="250" cy="250" r="180" fill="#ffffff" opacity="0.95"/>

  <!-- Decorative circle outline -->
  <circle cx="250" cy="250" r="180" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.3"/>

  <!-- Avatar initials -->
  <text x="250" y="280" font-family="Arial, sans-serif" font-size="100" font-weight="bold" text-anchor="middle" fill="url(#accentGradient2)">UK</text>

  <!-- Decorative geometric shapes -->
  <circle cx="100" cy="100" r="20" fill="#ffffff" opacity="0.7"/>
  <circle cx="400" cy="120" r="15" fill="#ffffff" opacity="0.5"/>
  <rect x="80" y="500" width="40" height="40" fill="#ffffff" opacity="0.6" rx="8"/>
  <rect x="380" y="520" width="35" height="35" fill="#ffffff" opacity="0.4" rx="7"/>

  <!-- Accent dots -->
  <circle cx="250" cy="50" r="8" fill="#ffffff" opacity="0.6"/>
  <circle cx="450" cy="300" r="6" fill="#ffffff" opacity="0.5"/>
  <circle cx="50" cy="400" r="7" fill="#ffffff" opacity="0.6"/>
</svg>