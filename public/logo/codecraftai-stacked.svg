<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600&display=swap');
    </style>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#123156" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#071126" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cBody" x1="106" y1="106" x2="406" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.45" stop-color="#4F8EF7"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="cEdge" x1="106" y1="106" x2="398" y2="302" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#A5F3FC" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#4F8EF7" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="cInner" x1="345" y1="226" x2="106" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#4F8EF7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="cSheen" x1="106" y1="106" x2="345" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="0.38" stop-color="#FFFFFF" stop-opacity="0.08"/>
