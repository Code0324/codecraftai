      <rect x="105" y="255" width="13" height="13" rx="3" fill="#4F8EF7" opacity="0.85"/>
      <rect x="91" y="230" width="12" height="12" rx="3" fill="#22D3EE" opacity="0.72"/>
      <rect x="79" y="252" width="10" height="10" rx="2.5" fill="#7C3AED" opacity="0.6"/>
      <rect x="67" y="236" width="9" height="9" rx="2.5" fill="#4F8EF7" opacity="0.48"/>
      <rect x="55" y="256" width="8" height="8" rx="2" fill="#22D3EE" opacity="0.36"/>
      <rect x="44" y="240" width="7" height="7" rx="2" fill="#7C3AED" opacity="0.26"/>
      <rect x="33" y="252" width="5.5" height="5.5" rx="1.5" fill="#4F8EF7" opacity="0.16"/>
      <rect x="24" y="242" width="4.5" height="4.5" rx="1.5" fill="#22D3EE" opacity="0.1"/>
