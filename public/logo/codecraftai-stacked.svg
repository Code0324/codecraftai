    <path d="M398.66 302.35 A150 150 0 1 1 398.66 209.65 L345.40 226.95 A94 94 0 1 0 345.40 285.05 Z" fill="#7C3AED" opacity="0.2" filter="url(#bloom)" transform="translate(8 14)"/>

    <path d="M398.66 302.35 A150 150 0 1 1 398.66 209.65 L345.40 226.95 A94 94 0 1 0 345.40 285.05 Z" fill="url(#cBody)"/>
    <path d="M398.66 302.35 A150 150 0 1 1 398.66 209.65 L345.40 226.95 A94 94 0 1 0 345.40 285.05 Z" fill="none" stroke="#071126" stroke-opacity="0.28" stroke-width="1.5"/>
    <path d="M398.66 302.35 A150 150 0 1 1 398.66 209.65" fill="none" stroke="url(#cEdge)" stroke-width="3" stroke-linecap="round"/>
    <path d="M345.40 226.95 A94 94 0 1 0 345.40 285.05" fill="none" stroke="url(#cInner)" stroke-width="2" stroke-linecap="round"/>
    <path d="M398.66 302.35 A150 150 0 1 1 398.66 209.65 L345.40 226.95 A94 94 0 1 0 345.40 285.05 Z" fill="url(#cSheen)"/>

    <g stroke="url(#bGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
